<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="/fragments/head :: head"></head>
  <body class="sub_page">
    <div class="hero_area">
      <div class="bg-box">
        <img th:src="@{/images/nav-bg.jpg}" alt="" />
      </div>
      <div th:replace="/fragments/header :: header"></div>
    </div>

    <!-- about section -->

    <section class="about_section layout_padding">
      <div class="container">
        <div class="posts">
          <h3><a th:utext="${post.title}">Title</a></h3>
          <h5
            th:text="'Author: ' + ${post.account.firstname} + ' | Created at: '+ ${#temporals.format(post.createdAt, 'dd MMMM yyyy HH:mm')}"
          ></h5>
          <p th:utext="${post.body}">body</p>
          <hr color="grey" />

          <div sec:authorize="isAuthenticated() " th:if="${isOwner}">
            <a
              th:href="@{'/posts/' + ${post.id} +'/edit'}"
              class="btn btn-secondary btn-lg active"
              role="button"
              aria-pressed="true"
              >Edit</a
            >
          </div>
        </div>
      </div>
    </section>
    <footer th:replace="/fragments/footer :: footer"></footer>
  </body>
</html>
